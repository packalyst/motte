# How long browsers may keep each file. The page shell, the service worker and the offline page
# are re-checked on every load (no-cache = revalidate, not "don't store"), so a panel update and a
# new service worker reach installed apps at once instead of whenever the browser's own guess
# expires (iOS keeps an installed app's files a long time). Build assets carry a content hash in
# their name, so they never change and are kept for a year. An empty value sends no header.
map $uri $cache_control {
    default         "";
    /index.html     "no-cache";
    /sw.js          "no-cache";
    /offline.html   "no-cache";
    /offline.js     "no-cache";
    ~^/assets/      "public, max-age=31536000, immutable";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Report-only CSP (hardening): logs violations to the browser console without blocking,
        # so we can confirm the app stays within policy before switching to an enforcing CSP.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
        add_header Cache-Control $cache_control always;
        # The pages can't be shown inside another site (clickjacking), the browser never guesses
        # a file's type, and links send only our origin. Traefik's security-headers middleware
        # covers the API routes; these cover the pages whatever route serves them.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
