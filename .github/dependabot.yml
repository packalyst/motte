# Dependabot — automated dependency update PRs, tuned to stay quiet:
#   - minor + patch updates are GROUPED into one PR per ecosystem (not one PR per dep)
#   - MAJOR version bumps are ignored for version-updates (churny/often breaking — review and
#     bump those deliberately). Security advisories still surface as Dependabot alerts in the
#     Security tab regardless of this.
#   - a low open-pull-requests-limit caps the noise
# NB: opening PRs also requires repo setting Settings → Actions → General → Workflow permissions →
# "Allow GitHub Actions to create and approve pull requests" to be ON, or Dependabot can only
# push branches (no PRs).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, go]
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # NB: /agent is intentionally not committed yet (.gitignore) — add a gomod entry when it is.

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, ui]
    groups:
      # xterm and its add-ons move together: an add-on's 0.x "minor" is built for the next xterm
      # major, so updated alone it breaks the console.
      xterm:
        patterns: ["@xterm/*"]
      ui-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      - dependency-name: "@xterm/addon-*"
        update-types: [version-update:semver-minor]
      # Published by a bot every few days, usually with no code change; updated on purpose.
      - dependency-name: simple-keyboard
        update-types: [version-update:semver-patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Docker base images — one block per Dockerfile dir; minor/patch only.
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, docker]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # A new Go line (1.26 → 1.27) is adopted deliberately with go.mod and the agent; patches still come.
      - dependency-name: golang
        update-types: [version-update:semver-minor]

  - package-ecosystem: docker
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, docker]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /containers/dnsmasq
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, docker]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /containers/turbotunnels
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, docker]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
