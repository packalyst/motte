# Managed by Motte. DHCP-only: DNS is disabled so AdGuard Home keeps :53.
port=0
# Identify clients by MAC only, as the panel does (device records, reservations, firewall).
# A cloned VM sends the same client ID as its original; keyed on it, dnsmasq would treat the
# two as one client and hand their lease back and forth.
dhcp-ignore-clid
# Per-network DHCP configs are written here by the panel (one file per managed interface).
conf-dir=/etc/dnsmasq.d/,*.conf
